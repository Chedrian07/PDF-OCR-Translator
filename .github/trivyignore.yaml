# release.yml이 push 전에 돌리는 trivy 이미지 스캔(HIGH/CRITICAL, 수정판 있는 것만)의
# 수용 목록이다. 항목마다 이유와 재검토 기한(expired_at)을 둔다 — 기한이 지나면 무시가
# 풀려 릴리스가 실패하므로 그 전에 다시 판단한다. purls로 지금 고정한 버전에만 건다:
# 버전을 올리면 이 무시는 자동으로 무효가 된다.
#
# transformers 4.57.1: 벤더 모델 코드(backend/app/vendor/unlimited_ocr)가 4.57.1 API에
# 묶여 고정한다(모델 카드 고정 — backend/pyproject.toml 주석). 아래 권고는 모두 5.x에서만
# 고쳐졌고, 전부 원격 저장소의 config·코드·채팅 템플릿을 믿는 경로다. 이 앱은 리비전을
# SHA로 고정(MODEL_REVISION)하고 trust_remote_code·custom_generate·Trainer·save_pretrained를
# 쓰지 않는다. MODEL_ID를 바꿀 땐 신뢰하는 저장소의 SHA만 쓴다.
# 같은 권고의 pip-audit ID(PYSEC-*)는 .github/workflows/ci.yml dependency-audit 잡에 있다.
vulnerabilities:
  - id: CVE-2026-4372
    purls:
      - pkg:pypi/transformers@4.57.1
    statement: >-
      config.json의 _attn_implementation_internal로 원격 저장소 코드를 끌어오는 RCE.
      리비전 SHA 고정 + 신뢰 저장소만 로드하므로 공격자 config가 들어올 경로가 없다.
    expired_at: 2027-04-01
  - id: CVE-2026-5241
    purls:
      - pkg:pypi/transformers@4.57.1
    statement: >-
      LightGlue 모델 로딩 경로에서 trust_remote_code가 무시되는 RCE. LightGlue를
      로드하지 않고, 로드하는 저장소는 리비전 SHA로 고정돼 있다.
    expired_at: 2027-04-01
  - id: CVE-2026-9856
    purls:
      - pkg:pypi/transformers@4.57.1
    statement: >-
      save_pretrained()가 chat_template 키를 파일명으로 쓰는 경로 탈출. 앱은 토크나이저·
      프로세서를 저장하지 않는다(save_pretrained 미사용).
    expired_at: 2027-04-01
  - id: CVE-2026-80047
    purls:
      - pkg:pypi/transformers@4.57.1
    statement: >-
      load_custom_generate()가 신뢰 확인 전에 원격 파일을 받는다. custom_generate를
      쓰지 않는다. 지금은 수정판이 없어 --ignore-unfixed로도 빠지지만, 5.x에만 수정판이
      나오면 여기서 같은 이유로 수용한다.
    expired_at: 2027-04-01
