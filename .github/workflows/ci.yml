# CI — backend pytest(+커버리지)·backend×native 통합·native 패리티·frontend
# node --test·sidecar 파서 테스트 + ruff 린트(backend·services) + 의존성 감사(pip-audit)
# + CPU 이미지 빌드·하드닝 스모크(amd64·arm64, push 없음) + 실 PDF 전 구간
# 하네스(verify-e2e). PR을 뺀 모든 실행(main push·nightly·수동)에서는 hermetic 브라우저
# E2E(e2e-mock)까지 — release.yml은 태그 커밋의 push CI 성공을 요구하므로 e2e-mock도
# 사실상 릴리스 게이트다.
# 실모델은 실행하지 않음: backend 테스트는 FakeEngine 기반, torch는 CPU 휠(uv 캐시 활용).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 러너 시간이 큰 잡(e2e-mock)은 PR을 막지 않는다 — main push·nightly·수동에서만 돈다.
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

# 액션은 전부 전체 커밋 SHA로 고정하고 버전은 주석으로 남긴다 — 태그는 다른 커밋으로
# 다시 밀릴 수 있다(2025 tj-actions/changed-files 유형). 갱신은 Dependabot이 PR로 연다
# (.github/dependabot.yml). checkout은 persist-credentials: false — 이후 단계가 토큰을
# .git/config에서 읽을 수 없게 한다(CI는 push하지 않는다).
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      # --locked: uv.lock 드리프트(pyproject만 고치고 lock 커밋 누락)를 CI에서 즉시
      # 실패시킨다. 없으면 uv가 조용히 재잠금해 통과시키고, Dockerfile의 --frozen은
      # 실패 대신 의존성을 빠뜨린 채 빌드해 컨테이너 기동 시 ImportError로 드러난다.
      - name: Install (torch CPU 휠)
        run: uv sync --locked --extra cpu
      # Docker 런타임(backend/Dockerfile)과 동일한 Noto CJK 경로로 폰트 해석을
      # 검증한다 — 없으면 내장 폴백 경고가 result.warnings에 남아 테스트가 깨진다.
      - name: Install CJK fonts (Docker 런타임과 동일 경로)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      # 커버리지는 게이트가 아니라 관측용 — pytest-cov는 lock을 건드리지 않도록
      # --with로 임시 설치한다(설정은 backend/pyproject.toml [tool.coverage.*]).
      - name: pytest (+ coverage)
        run: uv run --locked --with pytest-cov pytest --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  # backend × uocr_native 통합 — **프로덕션이 실제로 쓰는 조합**이다.
  # backend/Dockerfile이 `uv pip install /src/native`로 네이티브 모듈을 venv에 넣지만
  # uocr-native는 backend/pyproject.toml의 의존성 그래프 밖이라, 위 backend 잡은
  # 언제나 `HAVE_NATIVE=False`(순수 파이썬 폴백)로만 돌았다. 즉 컨테이너에서 도는
  # 코드 경로는 CI에서 한 번도 실행되지 않았고, test_native_ops.py의 패리티 검사도
  # skipif로 통째로 건너뛰었다(native 잡은 native/tests만 돈다 — 백엔드 래퍼 미검증).
  backend-native:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install (torch CPU 휠)
        run: uv sync --locked --extra cpu
      - name: Install CJK fonts (Docker 런타임과 동일 경로)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      # Dockerfile과 같은 방식으로 backend venv에 직접 설치한다. 이후 스텝은
      # `uv run`(환경을 uv.lock에 맞춰 재동기화한다) 대신 .venv/bin/python을 직접
      # 부른다 — uocr-native는 lock 밖 패키지라 정리 대상이 될지가 uv 버전·설정에
      # 달려 있고, 조용히 되돌려지면 이 잡은 backend 잡의 복제가 된다.
      - name: Install uocr_native into backend venv (backend/Dockerfile과 동일)
        run: uv pip install --python .venv/bin/python ../native
      # 게이트: 설치가 실패했거나 import가 깨졌는데 pytest가 skip으로 넘어가면
      # 이 잡은 초록인 채 아무것도 검증하지 않는다. 먼저 단언한다.
      - name: HAVE_NATIVE=True 단언 (조용한 skip 방지)
        run: >-
          .venv/bin/python -c
          "from app.native_ops import HAVE_NATIVE;
          assert HAVE_NATIVE, 'uocr_native 미설치 — 이 잡의 존재 이유가 사라진다';
          print('uocr_native OK')"
      - name: pytest (네이티브 설치 상태 전체 스위트)
        run: .venv/bin/python -m pytest

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      # dev 그룹만 설치(--only-group) — ruff에 base 의존성(transformers 등)은 불필요.
      # sidecar(services/*)는 자체 dev 그룹이 없어 backend uv.lock에 고정된 ruff를
      # 그대로 재사용한다 (버전 미고정으로 돌리면 최신 룰셋에 바로 red가 된다).
      # ruff는 파일별로 가장 가까운 [tool.ruff](services/*/pyproject.toml, py310)를 쓴다.
      - name: ruff check (backend + sidecar)
        run: uv run --locked --only-group dev ruff check . ../services

  # 의존성 취약점 감사 — 0.1.0은 배포 이미지에 HIGH/CRITICAL 20건이 남은 채 나갔다(어느 잡도
  # 스캔하지 않았다). backend uv.lock(배포 이미지와 같은 cpu extra)과 sidecar 잠금을 pip-audit로
  # 본다. 이미지(OS 패키지 포함)는 release.yml이 push 전에 trivy로 한 번 더 본다.
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: pip-audit — backend (uv.lock · torch CPU extra = 배포 이미지와 같은 집합)
        working-directory: backend
        run: |
          # 수용한 권고 — 모델 카드 고정(torch·transformers)으로 남는 것만 이유와 함께 둔다.
          # 재검토 기한이 지나면 이 잡이 실패한다: 다시 판단하고 날짜를 옮긴다
          # (같은 기한·이유의 trivy 쪽 목록: .github/trivyignore.yaml).
          [[ "$(date -u +%F)" < "2027-04-01" ]] \
            || { echo "::error::수용 권고 재검토 기한(2027-04-01)이 지났다"; exit 1; }
          ignores=(
            # torch 2.10.0 — 벤더 패치(PROVENANCE P11·P12·P16)가 2.10.0 동작에 맞춰 검증돼 고정
            PYSEC-2025-194   # CVE-2025-3000 jit.script 메모리 손상: 벤더 quick_gelu 정의만 script, 업로드 입력 미도달
            PYSEC-2026-139   # CVE-2026-4538 pt2 로딩 역직렬화: 가중치는 safetensors로만 읽는다(.pt/.pt2 없음)
            # transformers 4.57.1 — 벤더 모델 코드가 4.57.1 API에 묶여 고정. 리비전 SHA 고정·신뢰 저장소만
            PYSEC-2025-217   # CVE-2025-14929 X-CLIP 체크포인트 변환 스크립트: 쓰지 않는다
            PYSEC-2025-218   # CVE-2025-14930 GLM4 로딩 경로: GLM4를 로드하지 않는다
            PYSEC-2026-2288  # CVE-2026-1839 Trainer._load_rng_state의 torch.load: Trainer를 쓰지 않는다
            PYSEC-2026-2289  # CVE-2026-4372 config의 원격 attn 구현 로드: 리비전 SHA 고정 저장소만 로드
            PYSEC-2026-2290  # CVE-2026-5241 LightGlue trust_remote_code 우회: LightGlue를 로드하지 않는다
            PYSEC-2026-3929  # CVE-2026-9856 save_pretrained chat_template 경로 탈출: 저장하지 않는다
            CVE-2026-80047   # load_custom_generate 신뢰 확인 전 원격 파일 기록: custom_generate 미사용
          )
          args=()
          for id in "${ignores[@]}"; do args+=(--ignore-vuln "$id"); done
          uv export --frozen --no-hashes --extra cpu --no-emit-project -o "$RUNNER_TEMP/req.txt"
          # torch CPU 휠의 로컬 버전(+cpu)은 PyPI에 없어 '감사 불가'로 조용히 빠진다(실측) —
          # 로컬 표기를 떼어 같은 릴리스로 감사하고, --strict로 그런 누락 자체를 실패시킨다.
          sed -E -i 's/^([A-Za-z0-9._-]+==[^ ;+]+)\+[A-Za-z0-9._]+/\1/' "$RUNNER_TEMP/req.txt"
          uvx pip-audit==2.10.1 -r "$RUNNER_TEMP/req.txt" --disable-pip --no-deps --strict "${args[@]}"
      - name: pip-audit — sidecar 잠금 (해시 포함 requirements.lock)
        run: |
          for svc in ovisocr2 paddleocr_vl; do
            echo "== services/$svc"
            uvx pip-audit==2.10.1 -r "services/$svc/requirements.lock" --disable-pip
          done
          # paddlepaddle-gpu는 PyPI에 없는 CDN 휠 URL이라 위에서 '감사 불가'로 빠진다. 권고는
          # 같은 코드의 CPU 패키지 이름(paddlepaddle)으로 등록되므로 같은 버전을 OSV로 본다.
          ver=$(sed -nE 's#.*/paddlepaddle_gpu-([0-9.]+)-.*#\1#p' services/paddleocr_vl/requirements.lock | head -1)
          test -n "$ver"
          printf 'paddlepaddle==%s\n' "$ver" > "$RUNNER_TEMP/paddle.txt"
          uvx pip-audit==2.10.1 -r "$RUNNER_TEMP/paddle.txt" --disable-pip --no-deps -s osv

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # 의존성 설치 불필요 — 빌드 스텝/외부 의존성 없는 정적 프론트엔드.
      - name: node --test
        run: npm test --prefix frontend

  native:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # native/README.md의 단독 테스트 절차 그대로. 빌드 체인(scikit-build-core·
      # pybind11·ninja)은 PEP 517 격리 빌드로 자동 해결, cmake·C++17은 러너 기본 제공.
      - name: Build (pybind11 C++)
        run: |
          uv venv --python 3.12 .venv
          uv pip install -p .venv/bin/python -e . pytest numpy
      - name: pytest (parity)
        run: .venv/bin/python -m pytest tests/ -v

  # sidecar 파서/어댑터 테스트 — 최종 OCR 마크다운 형태를 결정하는 코드라 회귀가
  # 나면 GPU 서버 배포 뒤에야 눈으로 드러난다. parser.py·adapter.py·lifecycle.py는
  # stdlib만 쓰므로 모델·CUDA·vLLM·paddle 없이 돈다. HTTP 계층 테스트(tests/test_api.py —
  # 엔진 사망 503·폼 필드 상한)는 그 서비스의 requirements.lock을 제약(-c)으로 걸어 웹 계층을
  # 배포 이미지와 같은 버전으로 넣어 돌린다(uv는 제약 파일의 해시도 검증한다). 패키지 이름이나
  # fastapi 하나만 고정하면 fastapi가 상한 없이 요구하는 starlette(>=0.46)·anyio·annotated-doc이
  # PyPI 최신으로 풀려, 배포되지 않는 조합(예: starlette 1.7.0 — lock은 1.3.1)으로 GHSA-82w8
  # 회귀 가드를 돌리게 된다. 버전은 lock에만 적는다. lock 밖 패키지(pytest, ovisocr2의
  # pydantic·pillow·httpx — 운영에서는 vLLM 베이스 이미지 몫)만 최신으로 풀린다.
  sidecar:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        svc: [ovisocr2, paddleocr_vl]
    defaults:
      run:
        working-directory: services/${{ matrix.svc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: pytest (파서/어댑터 · 수명주기 · HTTP 계층)
        run: |
          uv venv --python 3.12 .venv
          uv pip install -p .venv/bin/python -c requirements.lock \
            pytest httpx fastapi python-multipart pillow
          .venv/bin/python -m pytest tests/

  # CPU 이미지 빌드 + 하드닝 스모크 — 이미지는 release.yml에서만 빌드돼 Dockerfile·네이티브
  # 빌드·.dockerignore 회귀가 태그 시점에야(또는 사용자의 `compose up --build`에서) 드러났다.
  # push는 하지 않는다. 스모크는 release.yml과 같은 scripts/smoke_image.sh다.
  # 캐시: main(push·nightly·수동)에서만 GHA 캐시를 채운다 — PR·태그 ref의 캐시는 다른 ref에서
  # 복원되지 않아 쿼터(저장소 10GB)만 먹고 uv 캐시를 밀어낸다. release.yml은 이 기본 브랜치
  # 캐시를 읽기만 한다(태그 실행도 기본 브랜치 캐시는 복원할 수 있다).
  docker-image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build CPU image (push 없음)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          build-args: TORCH_VARIANT=cpu
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: pdf-ocr-translator:ci-cpu-${{ matrix.arch }}
          cache-from: type=gha,scope=cpu-${{ matrix.arch }}
          cache-to: ${{ (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') && format('type=gha,mode=max,scope=cpu-{0}', matrix.arch) || '' }}
      - name: Smoke (하드닝 아래 textlayer 전 구간 — release.yml과 같은 검사)
        env:
          IMAGE: pdf-ocr-translator:ci-cpu-${{ matrix.arch }}
          OUT_DIR: ${{ runner.temp }}/image-smoke
        run: ./scripts/smoke_image.sh "$IMAGE"

  # 실 PDF 전 구간 하네스 (= make verify-e2e). 이 리포의 주요 안전망인데도 지금까지
  # 어떤 자동 트리거에도 걸려 있지 않았다 — 사람이 로컬에서 기억해야만 돌았다.
  # 외부 API·GPU·모델 다운로드 불필요(OCR_ENGINE=textlayer + scripts/mock_llm.py).
  # 앞 6페이지만 써서 러너 시간을 억제한다(로컬 실측 ≈2분 — 그중 61초는 429 Retry-After
  # 상한을 실제로 재는 백오프 대기다). 단언 수는 페이지 수와 무관하다. 개수는 여기 적지
  # 않는다 — 하네스가 자라면 낡는다(현재 값: docs/ARCHITECTURE.md §11.1·README).
  verify-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install backend (torch CPU 휠)
        run: uv sync --locked --extra cpu
      # 하네스가 한국어 PDF를 조판·추출해 tofu(□)를 세므로 CJK 폰트가 필수다 —
      # 없으면 "폰트 폴백 tofu 없음" 단언이 실패한다 (backend 잡과 동일 이유).
      - name: Install CJK fonts (Docker 런타임과 동일 경로)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      # 하네스는 backend/.venv/bin/python을 골라 서버·목을 띄운다. `uv run`을 거치면
      # 재동기화가 일어날 수 있어 인터프리터를 직접 부른다.
      # --work: 리포 밖(RUNNER_TEMP)에 두어 산출물이 작업 트리를 오염시키지 않게.
      - name: verify-e2e (실 PDF 6페이지 · 업로드→OCR→번역→PDF→뷰어→보안→결함주입)
        run: .venv/bin/python ../scripts/verify_e2e.py --pages 6 --work "$RUNNER_TEMP/verify-e2e"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: verify-e2e-artifacts
          # 서버 로그·내보낸 PDF만 올린다(잡 데이터 전체는 수백 MB가 될 수 있다).
          path: |
            ${{ runner.temp }}/verify-e2e/api.log
            ${{ runner.temp }}/verify-e2e/*.pdf
          if-no-files-found: ignore

  # mock OpenAI(로컬 http) + FakeEngine 백엔드를 직접 띄우는 hermetic 브라우저 E2E.
  # GPU·외부 API 불필요하지만 러너 시간이 커서 PR만 막지 않는다 — main push·nightly
  # (schedule)·수동 실행(workflow_dispatch)에서는 돈다. release.yml이 태그 커밋의 push CI
  # 성공을 요구하므로 이 잡이 흔들리면 그 커밋의 릴리스도 막힌다(재실행으로 해소).
  # de-flake가 확인되면 if:를 지워 PR에도 붙인다.
  e2e-mock:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      # 하네스가 backend/.venv/bin/python을 하드코딩 — uv 기본 환경 경로와 일치한다.
      - name: Install backend (torch CPU 휠)
        run: uv sync --locked --extra cpu
        working-directory: backend
      # backend 잡과 동일 이유 — 한국어 PDF 내보내기 검증에 CJK 폰트가 필요하다.
      - name: Install CJK fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install playwright chromium
        run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - name: mock full-flow E2E
        run: npm run test:e2e-mock
        working-directory: frontend
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: e2e-mock-shots
          path: frontend/tests/e2e/shots
          if-no-files-found: ignore
