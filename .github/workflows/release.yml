name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  verify-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate tag and package versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          python3 - <<'PY'
          import json, os, re, tomllib
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          assert os.environ['REF_TYPE'] == 'tag', 'Run releases on a version tag'
          assert re.fullmatch(r'v\d+\.\d+\.\d+', tag), f'Invalid release tag: {tag}'
          for path in ('backend', 'native', 'services/ovisocr2', 'services/paddleocr_vl'):
              version = tomllib.loads(Path(path, 'pyproject.toml').read_text())['project']['version']
              assert version == tag[1:], f'{path}: {version} != {tag}'
          assert json.loads(Path('frontend/package.json').read_text())['version'] == tag[1:]
          PY
      - name: Require successful CI for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$GITHUB_SHA" -f status=completed \
            --jq '.workflow_runs | any(.conclusion == "success" and (.event == "push" or .event == "workflow_dispatch"))')
          test "$passed" = true || { echo 'Release commit has no successful CI run'; exit 1; }

  publish-images:
    needs: verify-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Image coordinates
        id: image
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build release image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          build-args: TORCH_VARIANT=cpu
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}-cpu-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=cpu-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=cpu-${{ matrix.arch }}
      - name: Smoke test the image before publishing
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}-cpu-${{ matrix.arch }}
          RELEASE_VERSION: ${{ steps.image.outputs.version }}
        run: |
          docker run -d --name release-smoke -p 127.0.0.1:18000:8000 \
            -e OCR_ENGINE=textlayer -e PRELOAD_MODEL=1 \
            -e ALLOWED_HOSTS=localhost,127.0.0.1 "$IMAGE"
          trap 'docker logs release-smoke; docker rm -f release-smoke' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18000/api/health -o /tmp/release-health.json; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true
          python3 - <<'PY'
          import json, os, urllib.request
          health = json.load(open('/tmp/release-health.json'))
          assert health['engine'] == 'textlayer' and health['worker_alive']
          assert health['native_ops'], 'The release image must contain the native module'
          schema = json.load(urllib.request.urlopen('http://127.0.0.1:18000/openapi.json'))
          assert schema['info']['version'] == os.environ['RELEASE_VERSION']
          PY
          OUT_DIR="$RUNNER_TEMP/release-smoke" TIMEOUT_SECS=120 \
            ./scripts/smoke_e2e.sh http://127.0.0.1:18000
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}-cpu-${{ matrix.arch }}
        run: docker push "$IMAGE"

  publish-manifest:
    needs: publish-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-platform CPU image
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_image="ghcr.io/${GITHUB_REPOSITORY,,}"
          release_version="${RELEASE_TAG#v}"
          docker buildx imagetools create \
            -t "$release_image:$release_version-cpu" \
            -t "$release_image:$release_version" \
            -t "$release_image:latest" \
            "$release_image:$release_version-cpu-amd64" \
            "$release_image:$release_version-cpu-arm64"
          docker buildx imagetools inspect "$release_image:$release_version-cpu"
