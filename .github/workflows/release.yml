name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# 액션은 전부 전체 커밋 SHA로 고정하고 버전은 주석으로 남긴다 — 이 워크플로는 GHCR push와
# 릴리스 자산 업로드 권한을 쓰므로 태그 재지정 공급망 사고의 피해가 가장 크다(ci.yml 머리말).
permissions:
  contents: read
  actions: read

jobs:
  verify-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate tag and package versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          python3 - <<'PY'
          import json, os, re, tomllib
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          assert os.environ['REF_TYPE'] == 'tag', 'Run releases on a version tag'
          assert re.fullmatch(r'v\d+\.\d+\.\d+', tag), f'Invalid release tag: {tag}'
          for path in ('backend', 'native', 'services/ovisocr2', 'services/paddleocr_vl'):
              version = tomllib.loads(Path(path, 'pyproject.toml').read_text())['project']['version']
              assert version == tag[1:], f'{path}: {version} != {tag}'
          assert json.loads(Path('frontend/package.json').read_text())['version'] == tag[1:]
          PY
      # 커밋과 태그를 함께 push하면(`git push --follow-tags`) 이 잡이 같은 커밋의 CI보다 먼저
      # 돈다 — 예전에는 '완료된' 성공 CI만 찾고 바로 실패해 담당자가 재실행해야 했다.
      # 진행 중인(또는 아직 등록되지 않은) CI는 끝날 때까지 기다리고, 성공 없이 모두 끝났을
      # 때만 멈춘다. CI에는 의존성 감사·이미지 빌드 스모크까지 들어 있다.
      - name: Wait for a successful CI run on this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          start=$(date +%s)
          while :; do
            runs=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -f head_sha="$GITHUB_SHA" -f per_page=50 \
              --jq '[.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch")]')
            if [ "$(jq 'any(.[]; .status == "completed" and .conclusion == "success")' <<<"$runs")" = true ]; then
              echo "이 커밋의 CI 성공을 확인했다"
              exit 0
            fi
            total=$(jq 'length' <<<"$runs")
            pending=$(jq '[.[] | select(.status != "completed")] | length' <<<"$runs")
            waited=$(( $(date +%s) - start ))
            if [ "$pending" = 0 ] && [ "$total" -gt 0 ]; then
              echo "::error::이 커밋에 성공한 CI 실행이 없다(실행 ${total}개 모두 끝남) — CI를 (재)실행한 뒤 릴리스를 다시 돌린다"
              exit 1
            fi
            if [ "$total" = 0 ] && [ "$waited" -ge 600 ]; then
              echo "::error::이 커밋의 CI 실행이 10분 동안 나타나지 않았다 — 커밋이 main에 push됐는지 확인한다"
              exit 1
            fi
            if [ "$waited" -ge 5400 ]; then
              echo "::error::CI 완료를 90분 기다렸다 — 상태를 확인한 뒤 릴리스를 다시 돌린다"
              exit 1
            fi
            echo "CI 대기 중 (진행 ${pending}개 · 전체 ${total}개 · ${waited}초 경과) — 30초 뒤 다시 확인"
            sleep 30
          done

  publish-images:
    needs: verify-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image coordinates
        id: image
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build release image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          build-args: TORCH_VARIANT=cpu
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}-cpu-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
            org.opencontainers.image.licenses=MIT
          # 읽기 전용 — 태그 ref의 캐시는 다음 태그에서 복원되지 않아 쓰면 쿼터만 먹는다.
          # main CI(ci.yml docker-image 잡)가 같은 scope를 채운다.
          cache-from: type=gha,scope=cpu-${{ matrix.arch }}
      - name: Smoke test the image before publishing
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}-cpu-${{ matrix.arch }}
          RELEASE_VERSION: ${{ steps.image.outputs.version }}
          OUT_DIR: ${{ runner.temp }}/release-smoke
        run: ./scripts/smoke_image.sh "$IMAGE" "$RELEASE_VERSION"
      # 배포 전 취약점 게이트 — 0.1.0은 수정판이 이미 있던 HIGH/CRITICAL 20건(OS libexpat
      # 6 · pillow·urllib3·anyio 등)을 안은 채 GHCR과 오프라인 tar.gz로 나갔다.
      # 수정판이 있는 HIGH/CRITICAL이 하나라도 있으면 push 전에 멈춘다. 수용 목록은
      # .github/trivyignore.yaml(이유·재검토 기한)이다. trivy는 digest 고정 공식 이미지로 돈다.
      # 패키지 스캐너가 보지 못하는 동봉 MuPDF 버전은 backend tests/test_dependency_floor.py가 본다.
      - name: Scan the image before publishing (trivy, HIGH/CRITICAL with a fix)
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}-cpu-${{ matrix.arch }}
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.github/trivyignore.yaml:/trivyignore.yaml:ro" \
            aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
            image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --ignorefile /trivyignore.yaml --exit-code 1 --no-progress "$IMAGE"
      - name: Export tested image for offline installation
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}-cpu-${{ matrix.arch }}
          ARCHIVE: pdf-ocr-translator-${{ steps.image.outputs.version }}-cpu-${{ matrix.arch }}.tar.gz
        run: |
          set -euo pipefail
          docker save "$IMAGE" | gzip > "$RUNNER_TEMP/$ARCHIVE"
          gzip -t "$RUNNER_TEMP/$ARCHIVE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-image-${{ matrix.arch }}
          path: ${{ runner.temp }}/pdf-ocr-translator-*.tar.gz
          compression-level: 0
          retention-days: 7
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}-cpu-${{ matrix.arch }}
        run: docker push "$IMAGE"

  publish-manifest:
    needs: publish-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-platform CPU image
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_image="ghcr.io/${GITHUB_REPOSITORY,,}"
          release_version="${RELEASE_TAG#v}"
          docker buildx imagetools create \
            -t "$release_image:$release_version-cpu" \
            -t "$release_image:$release_version" \
            -t "$release_image:latest" \
            "$release_image:$release_version-cpu-amd64" \
            "$release_image:$release_version-cpu-arm64"
          docker buildx imagetools inspect "$release_image:$release_version-cpu"
