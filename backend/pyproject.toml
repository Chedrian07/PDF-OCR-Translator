[project]
name = "unlimited-ocr-web"
version = "0.1.0"
description = "PDF → Markdown 변환 웹 서비스 (baidu/Unlimited-OCR)"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    # ── 웹 ──
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "markdown-it-py>=3.0",
    # ── LLM 프로바이더 (app/llm — OpenAI/Ollama 비동기 클라이언트) ──
    "httpx>=0.27",
    # ── 설정 — 로컬 실행의 .env 파서(app/config.py). 인라인 주석·따옴표·export를
    #    compose와 같은 규칙으로 읽는다(uvicorn[standard]에 기대지 않고 직접 명시) ──
    "python-dotenv>=1.2.2",
    # ── 모델 (baidu/Unlimited-OCR README 고정 버전) ──
    # transformers: 벤더 모델 코드(app/vendor/unlimited_ocr)가 4.57.1 API에 묶여 고정한다.
    #   4.57.x는 보안 백포트가 끝난 라인이라 pip-audit 권고(CVE-2026-80047·CVE-2026-4372
    #   등)가 남는다. 수용 근거: 모두 원격 저장소의 config·코드를 믿는 경로인데 리비전을
    #   SHA로 고정(MODEL_REVISION)하고 trust_remote_code·custom_generate·Trainer·
    #   save_pretrained를 쓰지 않는다. MODEL_ID를 바꿀 땐 신뢰 저장소의 SHA만 쓴다.
    "transformers==4.57.1",
    "einops==0.8.2",
    "addict==2.4.0",
    "easydict==1.13",
    # ── 보안 고정 — 모델 수치와 무관한 I/O 라이브러리라 README 고정에서 이탈한다 ──
    # pymupdf: 동봉 MuPDF 1.28.0 미만은 CVE-2026-3308(이미지 stride 정수 오버플로 →
    #   힙 OOB 쓰기, 수정 커밋 a26f0142)이 남는다. 1.27.2.x도 MuPDF 1.27.2라 미수정이고
    #   패키지 스캐너는 동봉 MuPDF를 못 본다 — tests/test_dependency_floor.py가 지킨다.
    # pillow: 12.3.0 미만은 crop/paste 좌표 오버플로 OOB 쓰기 등 HIGH 권고가 남는다.
    "pillow==12.3.0",
    "pymupdf==1.28.2",
    # 내보내기 PDF에 임베드하는 CJK 폰트 서브셋 — 없으면 전체 폰트를
    # 임베드하는 예전 동작으로 조용히 폴백한다(pdf_export/subset.py).
    "fonttools>=4.53",
    "tqdm>=4.66",
    "requests>=2.32",
    "numpy>=1.26",
    "safetensors>=0.4",
    "huggingface-hub>=0.34",
    "mdit-py-plugins>=0.4",
]

# torch는 디바이스 백엔드별 인덱스가 달라 extra로 분리 (docker build ARG로 선택)
# metal: macOS arm64 전용 — PyPI 기본 휠에 MPS 지원이 내장되어 있어 별도 인덱스 불필요
# torch==2.10.0 고정: 벤더 패치(PROVENANCE.md P11·P12·P16)가 2.10.0 동작에 맞춰 검증됐다.
#   잔여 pip-audit 권고 CVE-2025-3000(torch.jit.script)·CVE-2026-4538(pt2 로딩)은 로컬
#   신뢰 코드 경로다 — 가중치는 safetensors로만 읽고(.pt/.pt2 로딩 없음), jit.script는
#   벤더 quick_gelu 정의에만 쓰여 업로드 입력이 닿지 않는다.
[project.optional-dependencies]
cpu = ["torch==2.10.0", "torchvision==0.25.0"]
cu129 = ["torch==2.10.0", "torchvision==0.25.0"]
metal = [
    "torch==2.10.0; sys_platform == 'darwin'",
    "torchvision==0.25.0; sys_platform == 'darwin'",
]
# mlx: Apple Silicon 기본 OCR 엔진(in-process MLX — OCR_DEVICE=auto가 고른다) 런타임. 마커
#   때문에 darwin-arm64(macOS 14 이상 휠)에만 설치되고 Linux·Docker 이미지에는 들어가지 않는다.
#   torch와 겹치지 않아 metal·cpu extra와 함께 쓴다 — `uv sync --extra metal --extra mlx`.
#   0.32.3은 감사 스파이크가 같은 가중치로 패리티를 검증한 버전이다. mlx-vlm은
#   transformers>=5.14를 요구해 4.57.1 고정과 충돌하므로 의존하지 않고 모델 코드를 벤더링한다.
mlx = ["mlx==0.32.3; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.15.21"]

[tool.uv]
# torch 변형(cpu·cu129·metal)끼리만 상호 배타다. mlx extra는 torch를 끌어오지 않으므로
# 어느 쪽과도 충돌하지 않아 여기에 넣지 않는다.
conflicts = [
    [{ extra = "cpu" }, { extra = "cu129" }],
    [{ extra = "cpu" }, { extra = "metal" }],
    [{ extra = "cu129" }, { extra = "metal" }],
]
package = false

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu129", extra = "cu129" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu129", extra = "cu129" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.ruff]
# .python-version(3.12) 기준. app/vendor는 업스트림 벤더 코드 — 린트 대상 아님.
# 규칙은 ruff 기본(E4/E7/E9/F)만 사용: I(임포트 정렬)·E501(라인 길이)은 diff 노이즈 방지로 미활성.
target-version = "py312"
extend-exclude = ["app/vendor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# 커버리지 — pytest-cov는 dev 그룹에 넣지 않고 `uv run --with pytest-cov`로 임시
# 설치한다(uv.lock을 커버리지 도구로 오염시키지 않기 위해서). 실행은 CI backend 잡과
# `make coverage`. 게이트(fail_under)는 두지 않는다 — 지금은 관측만 한다.
[tool.coverage.run]
source = ["app"]
branch = true
# app/vendor는 업스트림 벤더 코드 — 린트와 동일하게 측정 대상에서 제외한다.
omit = ["app/vendor/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
