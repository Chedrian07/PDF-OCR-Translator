# Unlimited-OCR-2: CPU backend; CUDA backend + pinned SGLang runtime.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  ocr-cpu:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        TORCH_VARIANT: cpu
    image: unlimited-ocr-web:cpu
    ports:
      # 기본 외부 노출(0.0.0.0) — ⚠ 이 서비스는 인증이 없다 (README §보안).
      # 신뢰 네트워크(VPN/Tailscale/방화벽 뒤)에서만 쓰고, 공개망 노출 시 반드시
      # 인증 리버스 프록시를 앞에 둘 것. 루프백 전용으로 되돌리려면 .env에
      # BIND_HOST=127.0.0.1 (네 백엔드 서비스 공통).
      - "${BIND_HOST:-0.0.0.0}:8000:8000"
    environment:
      OCR_DEVICE: cpu
      OCR_DTYPE: ${OCR_DTYPE:-auto}
      OCR_ENGINE: ${OCR_ENGINE:-unlimited2}
      MODEL_ID: ${MODEL_ID:-baidu/Unlimited-OCR-2}
      # MODEL_ID를 다른 저장소/포크로 바꾸면 그에 맞는 revision도 함께 지정해야
      # 한다 — 빈 값이면 config.py의 기본 고정 SHA(공식 저장소용)를 쓴다.
      MODEL_REVISION: ${MODEL_REVISION:-}
      PRELOAD_MODEL: ${PRELOAD_MODEL:-1}
      PAGES_PER_CHUNK: ${PAGES_PER_CHUNK:-8}
      RENDER_DPI: ${RENDER_DPI:-200}
      MAX_PAGES: ${MAX_PAGES:-200}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
      MAX_PAGE_OUTPUT_CHARS: ${MAX_PAGE_OUTPUT_CHARS:-16384}
      MAX_PAGE_OUTPUT_TOKENS: ${MAX_PAGE_OUTPUT_TOKENS:-6144}
      # docs/ARCHITECTURE.md §7에 문서화된 노브 — 여기서 스레딩하지 않으면 .env 값이
      # 컨테이너에서 조용히 무시된다(.env는 .dockerignore로 이미지에 없다).
      MAX_LENGTH: ${MAX_LENGTH:-32768}
      # 빈 값 = config.py 기본 "\n\n---\n\n" (config가 unicode_escape로 디코드한다)
      PAGE_SEPARATOR: ${PAGE_SEPARATOR:-}
      # 기본 '*' = 모든 Host 허용 (외부 노출 기본과 정합 — IP/호스트명을 미리 알 수
      # 없어 허용 목록을 고정할 수 없다). 특정 호스트로 제한(DNS rebinding 방어
      # 복원)하려면 .env에 ALLOWED_HOSTS=localhost,127.0.0.1,<서버IP·도메인>
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      JOB_TTL_DAYS: ${JOB_TTL_DAYS:-0}    # 0 = 잡 자동 삭제 비활성 (opt-in)
      HF_TOKEN: ${HF_TOKEN:-}
      OCR_CPU_THREADS: ${OCR_CPU_THREADS:-0}
      CUDA_LAUNCH_BLOCKING: ${CUDA_LAUNCH_BLOCKING:-}
      # ── 한국어 번역 (OpenAI 호환 API) — 미설정 시 번역 기능만 비활성 ──
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      TRANSLATE_MODEL: ${TRANSLATE_MODEL:-}
      TRANSLATE_API_MODE: ${TRANSLATE_API_MODE:-auto}
      TRANSLATE_CONCURRENCY: ${TRANSLATE_CONCURRENCY:-8}
      TRANSLATE_GLOBAL_CONCURRENCY: ${TRANSLATE_GLOBAL_CONCURRENCY:-}
      TRANSLATE_TIMEOUT_S: ${TRANSLATE_TIMEOUT_S:-180}
      TRANSLATE_STREAM: ${TRANSLATE_STREAM:-auto}
      TRANSLATE_MAX_RESPONSE_MB: ${TRANSLATE_MAX_RESPONSE_MB:-32}
      TRANSLATE_MAX_RETRIES: ${TRANSLATE_MAX_RETRIES:-3}
      TRANSLATE_TEMPERATURE: ${TRANSLATE_TEMPERATURE:-0}
      TRANSLATE_MAX_TOKENS_PARAM: ${TRANSLATE_MAX_TOKENS_PARAM:-max_tokens}
      TRANSLATE_REASONING: ${TRANSLATE_REASONING:-}
      TRANSLATE_REASONING_STYLE: ${TRANSLATE_REASONING_STYLE:-auto}
      TRANSLATE_EXTRA_BODY: ${TRANSLATE_EXTRA_BODY:-}
      TRANSLATE_CONTEXT: ${TRANSLATE_CONTEXT:-1}
      # 번역 PDF 내보내기용 사용자 지정 폰트(컨테이너 내 경로, 볼륨 마운트 필요).
      # .env는 dockerignore로 컨테이너에 없어 여기서 스레딩해야 동작한다.
      PDF_EXPORT_FONT: ${PDF_EXPORT_FONT:-}
      # 내보내기 전역 빌드 상한 (§5) — 잡 락은 같은 잡의 중복 빌드만 막는다.
      # FORMAT_VERSION 상향 직후엔 전 캐시가 무효화돼 서로 다른 잡의 빌드가 몰린다.
      # 0 이하 = 상한 비활성. 대기가 타임아웃을 넘으면 503 + Retry-After로 거절한다.
      PDF_EXPORT_MAX_CONCURRENT: ${PDF_EXPORT_MAX_CONCURRENT:-2}
      PDF_EXPORT_QUEUE_TIMEOUT_S: ${PDF_EXPORT_QUEUE_TIMEOUT_S:-30}
      OCR_FIDELITY_THRESHOLD: ${OCR_FIDELITY_THRESHOLD:-0.70}
      OCR_FIDELITY_MAX_RETRY_RATIO: ${OCR_FIDELITY_MAX_RETRY_RATIO:-0.2}
      PDF_EXPORT_WARM_WAIT_S: ${PDF_EXPORT_WARM_WAIT_S:-180}
      # PyMuPDF 격리 워커(§5) — 렌더·분석·내보내기를 서버 밖 프로세스에서 시간 상한을
      # 걸고 돌린다. 업로드 게이트는 렌더를 폭주시키는 PDF(중첩 XObject·대량 콘텐츠)를
      # 큐에 넣기 전에 400으로 거부한다. 설명은 .env.example 참조.
      PDF_PAGE_TIMEOUT_S: ${PDF_PAGE_TIMEOUT_S:-60}
      PDF_EXPORT_BUILD_TIMEOUT_S: ${PDF_EXPORT_BUILD_TIMEOUT_S:-900}
      PDF_WORKER_MEM_LIMIT_MB: ${PDF_WORKER_MEM_LIMIT_MB:-0}
      PDF_MAX_PAGE_CONTENT_MB: ${PDF_MAX_PAGE_CONTENT_MB:-64}
      PDF_MAX_PAGE_XOBJECT_CALLS: ${PDF_MAX_PAGE_XOBJECT_CALLS:-2000000}
      # ── 남용 방어 상한 (무인증 서비스의 비용 상한, §5) ──────────────
      # ⚠ 여기서 스레딩하지 않으면 .env에서 아무리 조여도 컨테이너는 코드 기본값을
      #   쓴다 — "조였다고 믿는" 상태가 유료 LLM 키 소진 방어에서 가장 위험하다.
      QA_RATE_LIMIT_PER_MIN: ${QA_RATE_LIMIT_PER_MIN:-30}
      QA_MAX_CONCURRENT: ${QA_MAX_CONCURRENT:-4}
      TRANSLATE_RATE_LIMIT_PER_MIN: ${TRANSLATE_RATE_LIMIT_PER_MIN:-12}
      TRANSLATE_MAX_ACTIVE: ${TRANSLATE_MAX_ACTIVE:-4}
      # 앞단 신뢰 프록시 홉 수 — 기본 0은 X-Forwarded-For를 완전히 무시한다(안전한 쪽).
      # 리버스 프록시 뒤에 둘 때만 홉 수를 넣는다: 0이면 레이트리밋 키가 프록시 IP
      # 하나로 붕괴해 사용자 한 명이 전체 상한을 소진한다(api.py::_client_key).
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
      # 그 헤더를 믿을 직접 연결 피어(프록시) IP·CIDR — 비우면 루프백만. 목록 밖 피어가
      # 보낸 X-Forwarded-For는 위조로 보고 무시한다(호스트 프록시는 브리지 주소로 보인다).
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      # ── textlayer 엔진 · 페이지 Q&A (Localight 통합) ──
      # 컨테이너의 기본 Ollama 주소는 host.docker.internal(allowlist 등재) = 호스트 Ollama.
      # 완전 격리(컨테이너 Ollama)는 compose.ollama.yaml overlay가 이 값을 덮어쓴다.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      LLM_LOCAL_OPENAI_BASE_URL: ${LLM_LOCAL_OPENAI_BASE_URL:-}
      LLM_LOCAL_OPENAI_MODEL: ${LLM_LOCAL_OPENAI_MODEL:-}
      LLM_LOCAL_OPENAI_MODELS: ${LLM_LOCAL_OPENAI_MODELS:-}
      LLM_LOCAL_OPENAI_API_KEY: ${LLM_LOCAL_OPENAI_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai-responses}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-low}
      # 기본값은 config.py와 동일 — .env는 .dockerignore로 이미지·컨테이너에 없어서
      # 여기서 스레딩하지 않으면 사용자의 .env 값이 조용히 무시된다 (make dev와 대칭)
      LLM_OPENAI_BASE_URL: ${LLM_OPENAI_BASE_URL:-https://api.openai.com/v1}
      # Q&A 전용 키 — 번역용 OPENAI_API_KEY와 분리돼 있다(app/llm/validate.py).
      # 없으면 컨테이너 배포에서 openai-* 공급자가 항상 available:false가 된다
      # (컨테이너 안에는 .env가 없어 dotenv 폴백도 없다).
      LLM_OPENAI_API_KEY: ${LLM_OPENAI_API_KEY:-}
      LLM_OPENAI_RESPONSES_MODELS: ${LLM_OPENAI_RESPONSES_MODELS:-gpt-5.6-luna,gpt-5.6-terra,gpt-5.6-sol}
      LLM_OPENAI_CHAT_MODELS: ${LLM_OPENAI_CHAT_MODELS:-chat-latest,gpt-5.6-luna,gpt-5.6-terra}
      LLM_OPENAI_RESPONSES_MODEL: ${LLM_OPENAI_RESPONSES_MODEL:-gpt-5.6-luna}
      LLM_OPENAI_CHAT_MODEL: ${LLM_OPENAI_CHAT_MODEL:-chat-latest}
    volumes:
      - ocr-data:/data
      - hf-cache-v2:/data/hf
    extra_hosts:
      # Linux 호스트에서도 host.docker.internal이 호스트를 가리키게 (호스트 Ollama 접근용)
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    # ── 컨테이너 하드닝 (CPU 스택 실측 검증: 업로드→OCR→번역→PDF/HTML/레이아웃 내보내기) ──
    # cap_drop: 비루트(uid 1000)+no-new-privileges라 쓰는 캡이 없다 — 경계 집합도 비운다.
    # read_only: 쓰기는 /data(볼륨)와 /tmp(tmpfs)뿐이다(docker diff 실측). 침해된 워커가
    #   컨테이너 레이어에 페이로드를 심어 재시작 뒤에도 남기는 경로를 막는다.
    # tmpfs /tmp: 업로드 스풀(MAX_UPLOAD_MB)·폰트 서브셋 임시 디렉터리 — MAX_UPLOAD_MB를
    #   크게 올리면 size도 함께 올린다(메모리 상한에 포함된다).
    # pids(deploy 아래 — compose가 pids_limit과 deploy.resources.limits를 함께 못 쓴다):
    #   fork 폭주 차단. torch CPU 스레드 풀(코어 수의 몇 배)을 덮는 여유값이다.
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=2g
    logging: *default-logging
    # 메모리 상한 — 호스트 전체를 OOM으로 끌고 가는 것을 막는 안전판이다.
    # 기본값은 넉넉하게 잡았고 .env에서 조정 가능하다(호스트 RAM보다 작게 둘 것).
    # CPU는 상한 대신 OCR_CPU_THREADS(스레드 수)로 조절한다 — 코어를 통째로
    # 묶으면 렌더/OCR 지연이 눈에 띄게 커진다.
    deploy:
      resources:
        limits:
          memory: ${OCR_CPU_MEM_LIMIT:-24g}
          pids: 1024   # fork 폭주 차단 — 설명은 ocr-cpu 하드닝 주석 참조
    restart: unless-stopped

  ocr-cuda:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        TORCH_VARIANT: cpu
    image: unlimited-ocr-web:cuda
    profiles: ["cuda"]
    depends_on: [unlimited-ocr2]
    ports:
      # 기본 외부 노출 — 되돌리기·보안 주의는 ocr-cpu의 ports 주석 참조
      - "${BIND_HOST:-0.0.0.0}:8001:8000"
    environment:
      OCR_DEVICE: cuda
      OCR_SIDECAR_URL: http://unlimited-ocr2:10000
      OCR_SIDECAR_CONNECT_TIMEOUT_S: ${OCR_SIDECAR_CONNECT_TIMEOUT_S:-10}
      OCR_SIDECAR_READ_TIMEOUT_S: ${OCR_SIDECAR_READ_TIMEOUT_S:-600}
      OCR_SIDECAR_HEALTH_TIMEOUT_S: ${OCR_SIDECAR_HEALTH_TIMEOUT_S:-5}
      OCR_SIDECAR_MAX_RESPONSE_MB: ${OCR_SIDECAR_MAX_RESPONSE_MB:-20}
      OCR_SIDECAR_MODEL_WAIT_S: ${OCR_SIDECAR_MODEL_WAIT_S:-900}
      OCR_DTYPE: ${OCR_DTYPE:-auto}
      OCR_ENGINE: ${OCR_ENGINE:-unlimited2}
      MODEL_ID: ${MODEL_ID:-baidu/Unlimited-OCR-2}
      MODEL_REVISION: ${MODEL_REVISION:-}   # 빈 값 = config.py 기본 고정 SHA (ocr-cpu 주석 참조)
      PRELOAD_MODEL: ${PRELOAD_MODEL:-1}
      PAGES_PER_CHUNK: ${PAGES_PER_CHUNK:-8}
      RENDER_DPI: ${RENDER_DPI:-200}
      MAX_PAGES: ${MAX_PAGES:-200}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
      MAX_PAGE_OUTPUT_CHARS: ${MAX_PAGE_OUTPUT_CHARS:-16384}
      MAX_PAGE_OUTPUT_TOKENS: ${MAX_PAGE_OUTPUT_TOKENS:-6144}
      # docs/ARCHITECTURE.md §7에 문서화된 노브 — 여기서 스레딩하지 않으면 .env 값이
      # 컨테이너에서 조용히 무시된다(.env는 .dockerignore로 이미지에 없다).
      MAX_LENGTH: ${MAX_LENGTH:-32768}
      # 빈 값 = config.py 기본 "\n\n---\n\n" (config가 unicode_escape로 디코드한다)
      PAGE_SEPARATOR: ${PAGE_SEPARATOR:-}
      # 기본 '*' = 모든 Host 허용 (외부 노출 기본과 정합 — IP/호스트명을 미리 알 수
      # 없어 허용 목록을 고정할 수 없다). 특정 호스트로 제한(DNS rebinding 방어
      # 복원)하려면 .env에 ALLOWED_HOSTS=localhost,127.0.0.1,<서버IP·도메인>
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      JOB_TTL_DAYS: ${JOB_TTL_DAYS:-0}    # 0 = 잡 자동 삭제 비활성 (opt-in)
      HF_TOKEN: ${HF_TOKEN:-}
      # GPU_DEVICE=N 으로 GPU 선택 (기본 0) — CUDA_DEVICE_ORDER=PCI_BUS_ID로
      # 인덱스를 nvidia-smi와 동일한 PCI 순서에 고정한다 (미설정 시 CUDA 기본
      # FASTEST_FIRST 휴리스틱이라 다중 GPU 호스트에서 인덱스가 비결정적).
      # 적용 후 헤더 배지/GET /api/health의 gpu_name으로 의도한 카드인지 확인할 것.
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      CUDA_VISIBLE_DEVICES: ${GPU_DEVICE:-0}
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      CUDA_LAUNCH_BLOCKING: ${CUDA_LAUNCH_BLOCKING:-}
      # ── 한국어 번역 (OpenAI 호환 API) — 미설정 시 번역 기능만 비활성 ──
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      TRANSLATE_MODEL: ${TRANSLATE_MODEL:-}
      TRANSLATE_API_MODE: ${TRANSLATE_API_MODE:-auto}
      TRANSLATE_CONCURRENCY: ${TRANSLATE_CONCURRENCY:-8}
      TRANSLATE_GLOBAL_CONCURRENCY: ${TRANSLATE_GLOBAL_CONCURRENCY:-}
      TRANSLATE_TIMEOUT_S: ${TRANSLATE_TIMEOUT_S:-180}
      TRANSLATE_STREAM: ${TRANSLATE_STREAM:-auto}
      TRANSLATE_MAX_RESPONSE_MB: ${TRANSLATE_MAX_RESPONSE_MB:-32}
      TRANSLATE_MAX_RETRIES: ${TRANSLATE_MAX_RETRIES:-3}
      TRANSLATE_TEMPERATURE: ${TRANSLATE_TEMPERATURE:-0}
      TRANSLATE_MAX_TOKENS_PARAM: ${TRANSLATE_MAX_TOKENS_PARAM:-max_tokens}
      TRANSLATE_REASONING: ${TRANSLATE_REASONING:-}
      TRANSLATE_REASONING_STYLE: ${TRANSLATE_REASONING_STYLE:-auto}
      TRANSLATE_EXTRA_BODY: ${TRANSLATE_EXTRA_BODY:-}
      TRANSLATE_CONTEXT: ${TRANSLATE_CONTEXT:-1}
      PDF_EXPORT_FONT: ${PDF_EXPORT_FONT:-}   # 내보내기 폰트 스레딩 — 설명은 ocr-cpu 참조
      # 내보내기 전역 빌드 상한 · 남용 방어 상한 · 프록시 홉 — 설명은 ocr-cpu 참조.
      # 이 노브들은 엔진과 무관하다(api.py·pipeline/derived.py가 읽는다) — 네 backend
      # 서비스 전부에 있어야 .env 값이 어느 스택에서든 동일하게 먹는다.
      PDF_EXPORT_MAX_CONCURRENT: ${PDF_EXPORT_MAX_CONCURRENT:-2}
      PDF_EXPORT_QUEUE_TIMEOUT_S: ${PDF_EXPORT_QUEUE_TIMEOUT_S:-30}
      OCR_FIDELITY_THRESHOLD: ${OCR_FIDELITY_THRESHOLD:-0.70}
      OCR_FIDELITY_MAX_RETRY_RATIO: ${OCR_FIDELITY_MAX_RETRY_RATIO:-0.2}
      PDF_EXPORT_WARM_WAIT_S: ${PDF_EXPORT_WARM_WAIT_S:-180}
      # PyMuPDF 격리 워커·업로드 게이트 — 설명은 ocr-cpu 참조
      PDF_PAGE_TIMEOUT_S: ${PDF_PAGE_TIMEOUT_S:-60}
      PDF_EXPORT_BUILD_TIMEOUT_S: ${PDF_EXPORT_BUILD_TIMEOUT_S:-900}
      PDF_WORKER_MEM_LIMIT_MB: ${PDF_WORKER_MEM_LIMIT_MB:-0}
      PDF_MAX_PAGE_CONTENT_MB: ${PDF_MAX_PAGE_CONTENT_MB:-64}
      PDF_MAX_PAGE_XOBJECT_CALLS: ${PDF_MAX_PAGE_XOBJECT_CALLS:-2000000}
      QA_RATE_LIMIT_PER_MIN: ${QA_RATE_LIMIT_PER_MIN:-30}
      QA_MAX_CONCURRENT: ${QA_MAX_CONCURRENT:-4}
      TRANSLATE_RATE_LIMIT_PER_MIN: ${TRANSLATE_RATE_LIMIT_PER_MIN:-12}
      TRANSLATE_MAX_ACTIVE: ${TRANSLATE_MAX_ACTIVE:-4}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}   # 신뢰 프록시 주소 — 설명은 ocr-cpu 참조
      # ── textlayer 엔진 · 페이지 Q&A (Localight 통합) — 설명은 ocr-cpu 참조 ──
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      LLM_LOCAL_OPENAI_BASE_URL: ${LLM_LOCAL_OPENAI_BASE_URL:-}
      LLM_LOCAL_OPENAI_MODEL: ${LLM_LOCAL_OPENAI_MODEL:-}
      LLM_LOCAL_OPENAI_MODELS: ${LLM_LOCAL_OPENAI_MODELS:-}
      LLM_LOCAL_OPENAI_API_KEY: ${LLM_LOCAL_OPENAI_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai-responses}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-low}
      LLM_OPENAI_BASE_URL: ${LLM_OPENAI_BASE_URL:-https://api.openai.com/v1}
      # Q&A 전용 키 — 번역용 OPENAI_API_KEY와 분리돼 있다(app/llm/validate.py).
      # 없으면 컨테이너 배포에서 openai-* 공급자가 항상 available:false가 된다
      # (컨테이너 안에는 .env가 없어 dotenv 폴백도 없다).
      LLM_OPENAI_API_KEY: ${LLM_OPENAI_API_KEY:-}
      LLM_OPENAI_RESPONSES_MODELS: ${LLM_OPENAI_RESPONSES_MODELS:-gpt-5.6-luna,gpt-5.6-terra,gpt-5.6-sol}
      LLM_OPENAI_CHAT_MODELS: ${LLM_OPENAI_CHAT_MODELS:-chat-latest,gpt-5.6-luna,gpt-5.6-terra}
      LLM_OPENAI_RESPONSES_MODEL: ${LLM_OPENAI_RESPONSES_MODEL:-gpt-5.6-luna}
      LLM_OPENAI_CHAT_MODEL: ${LLM_OPENAI_CHAT_MODEL:-chat-latest}
    volumes:
      - ocr-data:/data
      - hf-cache-v2:/data/hf
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    # 하드닝 — 설명은 ocr-cpu 참조. read_only는 CUDA 경로(드라이버 JIT 캐시 등)를 GPU
    # 호스트에서 검증하기 전까지 걸지 않는다.
    cap_drop: [ALL]
    logging: *default-logging
    # 메모리 상한 — 설명은 ocr-cpu 참조 (가중치는 VRAM, 여기 RAM은 렌더·조판용)
    deploy:
      resources:
        limits:
          memory: ${OCR_CUDA_MEM_LIMIT:-16g}
          pids: 1024   # fork 폭주 차단 — 설명은 ocr-cpu 하드닝 주석 참조
    restart: unless-stopped

  # CUDA 모델 추론은 고정 Unlimited-OCR-2 SGLang 서비스가 담당한다.
  unlimited-ocr2:
    build:
      context: .
      dockerfile: services/unlimited_ocr2/Dockerfile
    image: unlimited-ocr2-sglang:0.5.20.dev13-g75b9b06b02
    profiles: ["cuda"]
    gpus: all
    environment:
      CUDA_VISIBLE_DEVICES: ${GPU_DEVICE:-0}
      HF_TOKEN: ${HF_TOKEN:-}
      SGLANG_MEM_FRACTION: ${SGLANG_MEM_FRACTION:-0.65}
      SGLANG_CONCURRENCY: ${SGLANG_CONCURRENCY:-1}
    volumes:
      - hf-cache-v2:/data/hf
    shm_size: 4g
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    restart: unless-stopped

volumes:
  ocr-data:
  hf-cache-v2:
