# Unlimited-OCR — PDF → Markdown
#
#   CPU (기본):       docker compose up -d --build          → http://localhost:8000
#   CUDA(Unlimited):  docker compose up -d --build ocr-cuda → http://localhost:8001
#   OvisOCR2:      docker compose --profile ovis   up -d --build ovisocr2 ocr-ovis      → :8002
#   PaddleOCR-VL:  docker compose --profile paddle up -d --build paddleocr-vl ocr-paddle → :8003
#   Ollama(Q&A):   docker compose -f docker-compose.yml -f compose.ollama.yaml up -d --build ocr-cpu ollama
#                  (ollama 서비스는 overlay 파일에만 있다 — compose.ollama.yaml 헤더 참조)
#
# ⚠ 서비스명을 반드시 명시할 것: `--profile ovis up -d`만 쓰면 프로필 없는 기본
#   서비스(ocr-cpu)까지 함께 기동돼 6.7GB 모델을 불필요하게 로드한다.
#   같은 이유로 전환은 `docker compose stop ovisocr2 ocr-ovis`(대상만 정지)를 쓰고,
#   `--profile ovis down`은 ocr-cpu까지 내리는 전체 정리용으로만 쓴다.
#
# ocr-cpu는 프로필 없는 기본 서비스라 .env 없이도 기동된다.
# ocr-cuda는 cuda 프로필 — 서비스명을 명시하면 프로필이 자동 활성화된다.
# 모델 가중치(~6.7GB)는 최초 실행 시 hf-cache 볼륨에 1회 다운로드된다.
# Metal(Apple Silicon)은 컨테이너에서 GPU를 쓸 수 없어 로컬 uv로 실행한다 — README §macOS 참조.
#
# ⚠ 단일 GPU 원칙 (RTX 5070 Ti 16GB): 한 시점에 GPU를 쓰는 스택은 하나만 기동한다.
#   ocr-cuda / ovis 프로필 / paddle 프로필을 동시에 켜면 VRAM을 경쟁해 OOM이 난다.
#   전환:  docker compose stop ovisocr2 ocr-ovis
#          docker compose --profile paddle up -d --build paddleocr-vl ocr-paddle
#          (`--profile … down/up`만 쓰면 위 경고대로 ocr-cpu까지 지웠다 다시 만든다)
#   GPU는 sidecar(ovisocr2·paddleocr-vl)만 사용하고, ocr-ovis/ocr-paddle 백엔드는
#   GPU 예약 없이 sidecar와 HTTP로만 통신한다 (docs/CUDA_5070TI_MULTI_OCR_PLAN.md).
#
# ✅ 세 엔진 모두 OCR 모델을 CUDA에서 실행한다 — `gpus: all`을 받는 컨테이너는
#    모델을 돌리는 셋뿐이다: ocr-cuda(Unlimited)·ovisocr2(Ovis)·paddleocr-vl(Paddle).
#    ocr-ovis/ocr-paddle의 `TORCH_VARIANT: cpu`는 **웹/PDF렌더 오케스트레이터**용이며
#    OCR 추론과 무관하다(GPU는 sidecar 독점). 각 sidecar는 CUDA가 없으면 CPU로
#    조용히 강등하지 않고 명확한 오류로 **하드 실패**한다(app/model.py::_require_cuda).

# ── 전 서비스 공통 조각 (YAML 앵커) ────────────────────────────
# 로그 로테이션: 기본 json-file 드라이버는 상한이 없어 무한히 커진다. OCR/번역은
# 페이지·토큰 단위 진행 로그를 stdout으로 쏟으므로 restart: unless-stopped와 겹치면
# 장기 구동 호스트의 디스크를 조용히 채운다. 서비스당 최대 10MB×3 = 30MB로 묶는다.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  ocr-cpu:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        TORCH_VARIANT: cpu
    image: unlimited-ocr-web:cpu
    ports:
      # 기본 외부 노출(0.0.0.0) — ⚠ 이 서비스는 인증이 없다 (README §보안).
      # 신뢰 네트워크(VPN/Tailscale/방화벽 뒤)에서만 쓰고, 공개망 노출 시 반드시
      # 인증 리버스 프록시를 앞에 둘 것. 루프백 전용으로 되돌리려면 .env에
      # BIND_HOST=127.0.0.1 (네 백엔드 서비스 공통).
      - "${BIND_HOST:-0.0.0.0}:8000:8000"
    environment:
      OCR_DEVICE: cpu
      OCR_DTYPE: ${OCR_DTYPE:-auto}
      OCR_ENGINE: ${OCR_ENGINE:-unlimited}
      MODEL_ID: ${MODEL_ID:-baidu/Unlimited-OCR}
      # MODEL_ID를 다른 저장소/포크로 바꾸면 그에 맞는 revision도 함께 지정해야
      # 한다 — 빈 값이면 config.py의 기본 고정 SHA(공식 저장소용)를 쓴다.
      MODEL_REVISION: ${MODEL_REVISION:-}
      PRELOAD_MODEL: ${PRELOAD_MODEL:-1}
      PAGES_PER_CHUNK: ${PAGES_PER_CHUNK:-8}
      RENDER_DPI: ${RENDER_DPI:-200}
      MAX_PAGES: ${MAX_PAGES:-200}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
      MAX_PAGE_OUTPUT_CHARS: ${MAX_PAGE_OUTPUT_CHARS:-16384}
      MAX_PAGE_OUTPUT_TOKENS: ${MAX_PAGE_OUTPUT_TOKENS:-6144}
      # docs/ARCHITECTURE.md §7에 문서화된 노브 — 여기서 스레딩하지 않으면 .env 값이
      # 컨테이너에서 조용히 무시된다(.env는 .dockerignore로 이미지에 없다).
      MAX_LENGTH: ${MAX_LENGTH:-32768}
      # 빈 값 = config.py 기본 "\n\n---\n\n" (config가 unicode_escape로 디코드한다)
      PAGE_SEPARATOR: ${PAGE_SEPARATOR:-}
      # 기본 '*' = 모든 Host 허용 (외부 노출 기본과 정합 — IP/호스트명을 미리 알 수
      # 없어 허용 목록을 고정할 수 없다). 특정 호스트로 제한(DNS rebinding 방어
      # 복원)하려면 .env에 ALLOWED_HOSTS=localhost,127.0.0.1,<서버IP·도메인>
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      JOB_TTL_DAYS: ${JOB_TTL_DAYS:-0}    # 0 = 잡 자동 삭제 비활성 (opt-in)
      HF_TOKEN: ${HF_TOKEN:-}
      OCR_CPU_THREADS: ${OCR_CPU_THREADS:-0}
      OCR_FAST_DECODE: ${OCR_FAST_DECODE:-1}
      OCR_DECODE_BLOCK: ${OCR_DECODE_BLOCK:-8}
      OCR_CUDA_GRAPHS: ${OCR_CUDA_GRAPHS:-}
      OCR_MOE_FUSED: ${OCR_MOE_FUSED:-}
      OCR_MOE_FAST: ${OCR_MOE_FAST:-}
      OCR_SDPA: ${OCR_SDPA:-}
      OCR_NGRAM_HOST: ${OCR_NGRAM_HOST:-}
      CUDA_LAUNCH_BLOCKING: ${CUDA_LAUNCH_BLOCKING:-}
      # ── 한국어 번역 (OpenAI 호환 API) — 미설정 시 번역 기능만 비활성 ──
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      TRANSLATE_MODEL: ${TRANSLATE_MODEL:-}
      TRANSLATE_API_MODE: ${TRANSLATE_API_MODE:-auto}
      TRANSLATE_CONCURRENCY: ${TRANSLATE_CONCURRENCY:-8}
      TRANSLATE_GLOBAL_CONCURRENCY: ${TRANSLATE_GLOBAL_CONCURRENCY:-}
      TRANSLATE_TIMEOUT_S: ${TRANSLATE_TIMEOUT_S:-180}
      TRANSLATE_MAX_RETRIES: ${TRANSLATE_MAX_RETRIES:-3}
      TRANSLATE_TEMPERATURE: ${TRANSLATE_TEMPERATURE:-0}
      TRANSLATE_MAX_TOKENS_PARAM: ${TRANSLATE_MAX_TOKENS_PARAM:-max_tokens}
      TRANSLATE_REASONING: ${TRANSLATE_REASONING:-}
      TRANSLATE_CONTEXT: ${TRANSLATE_CONTEXT:-1}
      # 번역 PDF 내보내기용 사용자 지정 폰트(컨테이너 내 경로, 볼륨 마운트 필요).
      # .env는 dockerignore로 컨테이너에 없어 여기서 스레딩해야 동작한다.
      PDF_EXPORT_FONT: ${PDF_EXPORT_FONT:-}
      # ── textlayer 엔진 · 페이지 Q&A (Localight 통합) ──
      OCR_LANGUAGES: ${OCR_LANGUAGES:-eng+kor}
      NATIVE_TEXT_THRESHOLD: ${NATIVE_TEXT_THRESHOLD:-120}
      # 컨테이너의 기본 Ollama 주소는 host.docker.internal(allowlist 등재) = 호스트 Ollama.
      # 완전 격리(컨테이너 Ollama)는 compose.ollama.yaml overlay가 이 값을 덮어쓴다.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai-responses}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-low}
      # 기본값은 config.py와 동일 — .env는 .dockerignore로 이미지·컨테이너에 없어서
      # 여기서 스레딩하지 않으면 사용자의 .env 값이 조용히 무시된다 (make dev와 대칭)
      LLM_OPENAI_BASE_URL: ${LLM_OPENAI_BASE_URL:-https://api.openai.com/v1}
      # Q&A 전용 키 — 번역용 OPENAI_API_KEY와 분리돼 있다(app/llm/validate.py).
      # 없으면 컨테이너 배포에서 openai-* 공급자가 항상 available:false가 된다
      # (컨테이너 안에는 .env가 없어 dotenv 폴백도 없다).
      LLM_OPENAI_API_KEY: ${LLM_OPENAI_API_KEY:-}
      LLM_OPENAI_RESPONSES_MODELS: ${LLM_OPENAI_RESPONSES_MODELS:-gpt-5.6-luna,gpt-5.6-terra,gpt-5.6-sol}
      LLM_OPENAI_CHAT_MODELS: ${LLM_OPENAI_CHAT_MODELS:-chat-latest,gpt-5.6-luna,gpt-5.6-terra}
      LLM_OPENAI_RESPONSES_MODEL: ${LLM_OPENAI_RESPONSES_MODEL:-gpt-5.6-luna}
      LLM_OPENAI_CHAT_MODEL: ${LLM_OPENAI_CHAT_MODEL:-chat-latest}
    volumes:
      - ocr-data:/data
      - hf-cache:/data/hf
    extra_hosts:
      # Linux 호스트에서도 host.docker.internal이 호스트를 가리키게 (호스트 Ollama 접근용)
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    # 메모리 상한 — 호스트 전체를 OOM으로 끌고 가는 것을 막는 안전판이다.
    # 기본값은 넉넉하게 잡았고 .env에서 조정 가능하다(호스트 RAM보다 작게 둘 것).
    # CPU는 상한 대신 OCR_CPU_THREADS(스레드 수)로 조절한다 — 코어를 통째로
    # 묶으면 렌더/OCR 지연이 눈에 띄게 커진다.
    deploy:
      resources:
        limits:
          memory: ${OCR_CPU_MEM_LIMIT:-24g}
    restart: unless-stopped

  ocr-cuda:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        TORCH_VARIANT: cu129
    image: unlimited-ocr-web:cuda
    profiles: ["cuda"]
    gpus: all
    ports:
      # 기본 외부 노출 — 되돌리기·보안 주의는 ocr-cpu의 ports 주석 참조
      - "${BIND_HOST:-0.0.0.0}:8001:8000"
    environment:
      OCR_DEVICE: cuda
      OCR_DTYPE: ${OCR_DTYPE:-auto}
      OCR_ENGINE: ${OCR_ENGINE:-unlimited}
      MODEL_ID: ${MODEL_ID:-baidu/Unlimited-OCR}
      MODEL_REVISION: ${MODEL_REVISION:-}   # 빈 값 = config.py 기본 고정 SHA (ocr-cpu 주석 참조)
      PRELOAD_MODEL: ${PRELOAD_MODEL:-1}
      PAGES_PER_CHUNK: ${PAGES_PER_CHUNK:-8}
      RENDER_DPI: ${RENDER_DPI:-200}
      MAX_PAGES: ${MAX_PAGES:-200}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
      MAX_PAGE_OUTPUT_CHARS: ${MAX_PAGE_OUTPUT_CHARS:-16384}
      MAX_PAGE_OUTPUT_TOKENS: ${MAX_PAGE_OUTPUT_TOKENS:-6144}
      # docs/ARCHITECTURE.md §7에 문서화된 노브 — 여기서 스레딩하지 않으면 .env 값이
      # 컨테이너에서 조용히 무시된다(.env는 .dockerignore로 이미지에 없다).
      MAX_LENGTH: ${MAX_LENGTH:-32768}
      # 빈 값 = config.py 기본 "\n\n---\n\n" (config가 unicode_escape로 디코드한다)
      PAGE_SEPARATOR: ${PAGE_SEPARATOR:-}
      # 기본 '*' = 모든 Host 허용 (외부 노출 기본과 정합 — IP/호스트명을 미리 알 수
      # 없어 허용 목록을 고정할 수 없다). 특정 호스트로 제한(DNS rebinding 방어
      # 복원)하려면 .env에 ALLOWED_HOSTS=localhost,127.0.0.1,<서버IP·도메인>
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      JOB_TTL_DAYS: ${JOB_TTL_DAYS:-0}    # 0 = 잡 자동 삭제 비활성 (opt-in)
      HF_TOKEN: ${HF_TOKEN:-}
      # GPU_DEVICE=N 으로 GPU 선택 (기본 0) — CUDA_DEVICE_ORDER=PCI_BUS_ID로
      # 인덱스를 nvidia-smi와 동일한 PCI 순서에 고정한다 (미설정 시 CUDA 기본
      # FASTEST_FIRST 휴리스틱이라 다중 GPU 호스트에서 인덱스가 비결정적).
      # 적용 후 헤더 배지/GET /api/health의 gpu_name으로 의도한 카드인지 확인할 것.
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      CUDA_VISIBLE_DEVICES: ${GPU_DEVICE:-0}
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      OCR_FAST_DECODE: ${OCR_FAST_DECODE:-1}
      OCR_DECODE_BLOCK: ${OCR_DECODE_BLOCK:-8}
      OCR_CUDA_GRAPHS: ${OCR_CUDA_GRAPHS:-}
      OCR_MOE_FUSED: ${OCR_MOE_FUSED:-}
      OCR_MOE_FAST: ${OCR_MOE_FAST:-}
      OCR_SDPA: ${OCR_SDPA:-}
      OCR_NGRAM_HOST: ${OCR_NGRAM_HOST:-}
      CUDA_LAUNCH_BLOCKING: ${CUDA_LAUNCH_BLOCKING:-}
      # ── 한국어 번역 (OpenAI 호환 API) — 미설정 시 번역 기능만 비활성 ──
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      TRANSLATE_MODEL: ${TRANSLATE_MODEL:-}
      TRANSLATE_API_MODE: ${TRANSLATE_API_MODE:-auto}
      TRANSLATE_CONCURRENCY: ${TRANSLATE_CONCURRENCY:-8}
      TRANSLATE_GLOBAL_CONCURRENCY: ${TRANSLATE_GLOBAL_CONCURRENCY:-}
      TRANSLATE_TIMEOUT_S: ${TRANSLATE_TIMEOUT_S:-180}
      TRANSLATE_MAX_RETRIES: ${TRANSLATE_MAX_RETRIES:-3}
      TRANSLATE_TEMPERATURE: ${TRANSLATE_TEMPERATURE:-0}
      TRANSLATE_MAX_TOKENS_PARAM: ${TRANSLATE_MAX_TOKENS_PARAM:-max_tokens}
      TRANSLATE_REASONING: ${TRANSLATE_REASONING:-}
      TRANSLATE_CONTEXT: ${TRANSLATE_CONTEXT:-1}
      PDF_EXPORT_FONT: ${PDF_EXPORT_FONT:-}   # 내보내기 폰트 스레딩 — 설명은 ocr-cpu 참조
      # ── textlayer 엔진 · 페이지 Q&A (Localight 통합) — 설명은 ocr-cpu 참조 ──
      OCR_LANGUAGES: ${OCR_LANGUAGES:-eng+kor}
      NATIVE_TEXT_THRESHOLD: ${NATIVE_TEXT_THRESHOLD:-120}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai-responses}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-low}
      LLM_OPENAI_BASE_URL: ${LLM_OPENAI_BASE_URL:-https://api.openai.com/v1}
      # Q&A 전용 키 — 번역용 OPENAI_API_KEY와 분리돼 있다(app/llm/validate.py).
      # 없으면 컨테이너 배포에서 openai-* 공급자가 항상 available:false가 된다
      # (컨테이너 안에는 .env가 없어 dotenv 폴백도 없다).
      LLM_OPENAI_API_KEY: ${LLM_OPENAI_API_KEY:-}
      LLM_OPENAI_RESPONSES_MODELS: ${LLM_OPENAI_RESPONSES_MODELS:-gpt-5.6-luna,gpt-5.6-terra,gpt-5.6-sol}
      LLM_OPENAI_CHAT_MODELS: ${LLM_OPENAI_CHAT_MODELS:-chat-latest,gpt-5.6-luna,gpt-5.6-terra}
      LLM_OPENAI_RESPONSES_MODEL: ${LLM_OPENAI_RESPONSES_MODEL:-gpt-5.6-luna}
      LLM_OPENAI_CHAT_MODEL: ${LLM_OPENAI_CHAT_MODEL:-chat-latest}
    volumes:
      - ocr-data:/data
      - hf-cache:/data/hf
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    # 메모리 상한 — 설명은 ocr-cpu 참조 (가중치는 VRAM, 여기 RAM은 렌더·조판용)
    deploy:
      resources:
        limits:
          memory: ${OCR_CUDA_MEM_LIMIT:-16g}
    restart: unless-stopped

  # ── OvisOCR2 스택 (profile: ovis) ────────────────────────────
  # backend(ocr-ovis)는 GPU 미사용 — GPU는 ovisocr2 sidecar 전용.
  ocr-ovis:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        TORCH_VARIANT: cpu   # sidecar 클라이언트 — torch GPU 불필요 (이미지 재사용)
    image: unlimited-ocr-web:cpu
    profiles: ["ovis"]
    ports:
      # 기본 외부 노출 — 되돌리기·보안 주의는 ocr-cpu의 ports 주석 참조
      - "${BIND_HOST:-0.0.0.0}:8002:8000"
    environment:
      OCR_DEVICE: cpu                # backend 프로세스는 GPU를 쓰지 않는다
      OCR_ENGINE: ovisocr2
      OCR_SIDECAR_URL: http://ovisocr2:8080
      OCR_SIDECAR_CONNECT_TIMEOUT_S: ${OCR_SIDECAR_CONNECT_TIMEOUT_S:-10}
      OCR_SIDECAR_READ_TIMEOUT_S: ${OCR_SIDECAR_READ_TIMEOUT_S:-600}
      OCR_SIDECAR_HEALTH_TIMEOUT_S: ${OCR_SIDECAR_HEALTH_TIMEOUT_S:-5}
      OCR_SIDECAR_MAX_RESPONSE_MB: ${OCR_SIDECAR_MAX_RESPONSE_MB:-20}
      OCR_SIDECAR_RETRIES: ${OCR_SIDECAR_RETRIES:-1}
      # 잡이 sidecar 모델 준비를 기다리는 상한(초) — 타임아웃 오류 메시지가 안내하는
      # 튜닝 노브. .env는 dockerignore로 컨테이너에 없으므로 여기서 스레딩해야 동작한다.
      OCR_SIDECAR_MODEL_WAIT_S: ${OCR_SIDECAR_MODEL_WAIT_S:-900}
      OCR_REMOTE_PAGE_CONCURRENCY: ${OCR_REMOTE_PAGE_CONCURRENCY:-1}
      PRELOAD_MODEL: ${PRELOAD_MODEL:-1}
      RENDER_DPI: ${RENDER_DPI:-200}
      MAX_PAGES: ${MAX_PAGES:-200}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
      # 페이지 구분자는 **엔진과 무관**하다 — merge.py의 result.md 조립, render.py의
      # doc-page 분할, qa.py의 페이지 컨텍스트 추출이 전부 이 값으로 split한다.
      # 여기서 스레딩하지 않으면 .env의 PAGE_SEPARATOR가 sidecar 스택에서만 조용히
      # 무시돼 Q&A 페이지 인덱스가 ocr-cpu/ocr-cuda와 어긋난다.
      # 빈 값 = config.py 기본 "\n\n---\n\n" (config가 unicode_escape로 디코드한다)
      # ⚠ MAX_LENGTH는 반대로 engine/unlimited.py 전용(로컬 생성 상한)이라 sidecar
      #   스택(ocr-ovis/ocr-paddle)에는 넣지 않는다 — 넣어도 소비하는 코드가 없다.
      PAGE_SEPARATOR: ${PAGE_SEPARATOR:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}   # 기본 * = 모든 Host 허용 (ocr-cpu 주석 참조)
      JOB_TTL_DAYS: ${JOB_TTL_DAYS:-0}
      # ── 한국어 번역 (OpenAI 호환 API) — 미설정 시 번역 기능만 비활성 ──
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      TRANSLATE_MODEL: ${TRANSLATE_MODEL:-}
      TRANSLATE_API_MODE: ${TRANSLATE_API_MODE:-auto}
      TRANSLATE_CONCURRENCY: ${TRANSLATE_CONCURRENCY:-8}
      TRANSLATE_GLOBAL_CONCURRENCY: ${TRANSLATE_GLOBAL_CONCURRENCY:-}
      TRANSLATE_TIMEOUT_S: ${TRANSLATE_TIMEOUT_S:-180}
      TRANSLATE_MAX_RETRIES: ${TRANSLATE_MAX_RETRIES:-3}
      TRANSLATE_TEMPERATURE: ${TRANSLATE_TEMPERATURE:-0}
      TRANSLATE_MAX_TOKENS_PARAM: ${TRANSLATE_MAX_TOKENS_PARAM:-max_tokens}
      TRANSLATE_REASONING: ${TRANSLATE_REASONING:-}
      TRANSLATE_CONTEXT: ${TRANSLATE_CONTEXT:-1}
      PDF_EXPORT_FONT: ${PDF_EXPORT_FONT:-}   # 내보내기 폰트 스레딩 — 설명은 ocr-cpu 참조
      # ── textlayer 엔진 · 페이지 Q&A (Localight 통합) — 설명은 ocr-cpu 참조 ──
      OCR_LANGUAGES: ${OCR_LANGUAGES:-eng+kor}
      NATIVE_TEXT_THRESHOLD: ${NATIVE_TEXT_THRESHOLD:-120}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai-responses}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-low}
      LLM_OPENAI_BASE_URL: ${LLM_OPENAI_BASE_URL:-https://api.openai.com/v1}
      # Q&A 전용 키 — 번역용 OPENAI_API_KEY와 분리돼 있다(app/llm/validate.py).
      # 없으면 컨테이너 배포에서 openai-* 공급자가 항상 available:false가 된다
      # (컨테이너 안에는 .env가 없어 dotenv 폴백도 없다).
      LLM_OPENAI_API_KEY: ${LLM_OPENAI_API_KEY:-}
      LLM_OPENAI_RESPONSES_MODELS: ${LLM_OPENAI_RESPONSES_MODELS:-gpt-5.6-luna,gpt-5.6-terra,gpt-5.6-sol}
      LLM_OPENAI_CHAT_MODELS: ${LLM_OPENAI_CHAT_MODELS:-chat-latest,gpt-5.6-luna,gpt-5.6-terra}
      LLM_OPENAI_RESPONSES_MODEL: ${LLM_OPENAI_RESPONSES_MODEL:-gpt-5.6-luna}
      LLM_OPENAI_CHAT_MODEL: ${LLM_OPENAI_CHAT_MODEL:-chat-latest}
    volumes:
      # 잡 데이터는 네 백엔드가 공유한다 — 엔진(스택)을 바꿔도 잡 이력이 남아야 한다.
      # ocr-cpu와 동일 이미지·동일 uid(1000)라 소유권 충돌은 없다.
      - ocr-data:/data
      - hf-cache:/data/hf
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    depends_on:
      ovisocr2:
        # service_healthy 대신 service_started: 최초 모델 다운로드가 수십 분일 수
        # 있고, backend는 sidecar 미준비를 health/잡 오류로 안전하게 표면화한다.
        condition: service_started
    logging: *default-logging
    # 메모리 상한 — 설명은 ocr-cpu 참조 (.env로 조정 가능)
    deploy:
      resources:
        limits:
          memory: ${OCR_WEB_MEM_LIMIT:-8g}
    restart: unless-stopped

  ovisocr2:
    build:
      context: services/ovisocr2
    image: ovisocr2-sidecar:0.22.1-cu129
    profiles: ["ovis"]
    gpus: all
    # 포트는 Docker 내부 네트워크에만 노출 — 브라우저 접근은 ocr-ovis(8002)로만
    expose:
      - "8080"
    environment:
      CUDA_DEVICE_ORDER: PCI_BUS_ID    # GPU_DEVICE 인덱스를 nvidia-smi(PCI) 순서에 고정
      CUDA_VISIBLE_DEVICES: ${GPU_DEVICE:-0}
      # vLLM torch.compile 아티팩트·triton JIT 커널 캐시를 볼륨에 영속화 —
      # 없으면 컨테이너 재생성마다 ~40초 콜드 컴파일을 반복한다 (모델/설정
      # 해시가 캐시 키라 무효화는 자동, docs/OVISOCR2_CUDA_5070TI.md 실측).
      VLLM_CACHE_ROOT: /data/hf/.cache-vllm
      TRITON_CACHE_DIR: /data/hf/.cache-triton
      HF_TOKEN: ${HF_TOKEN:-}          # 빌드 레이어가 아닌 runtime env로만 전달
      OVIS_MODEL_ID: ${OVIS_MODEL_ID:-ATH-MaaS/OvisOCR2}
      OVIS_MODEL_REVISION: ${OVIS_MODEL_REVISION:-}   # 빈 값 = 코드 기본 고정 SHA
      OVIS_DTYPE: ${OVIS_DTYPE:-bfloat16}
      OVIS_GPU_MEMORY_UTILIZATION: ${OVIS_GPU_MEMORY_UTILIZATION:-0.80}
      OVIS_MAX_MODEL_LEN: ${OVIS_MAX_MODEL_LEN:-24576}
      OVIS_MAX_OUTPUT_TOKENS: ${OVIS_MAX_OUTPUT_TOKENS:-8192}
      OVIS_MAX_NUM_SEQS: ${OVIS_MAX_NUM_SEQS:-1}
      OVIS_MIN_PIXELS: ${OVIS_MIN_PIXELS:-}
      OVIS_MAX_PIXELS: ${OVIS_MAX_PIXELS:-}
      OVIS_GDN_PREFILL_BACKEND: ${OVIS_GDN_PREFILL_BACKEND:-triton}
      OVIS_MAX_UPLOAD_MB: ${OVIS_MAX_UPLOAD_MB:-128}   # backend 페이지 PNG 상한과 정합
    volumes:
      - ovis-hf-cache:/data/hf
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    # 메모리 상한 — 설명은 ocr-cpu 참조 (.env로 조정 가능)
    deploy:
      resources:
        limits:
          memory: ${OVIS_MEM_LIMIT:-24g}
    restart: unless-stopped

  # ── PaddleOCR-VL-1.6 스택 (profile: paddle) ──────────────────
  ocr-paddle:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        TORCH_VARIANT: cpu
    image: unlimited-ocr-web:cpu
    profiles: ["paddle"]
    ports:
      # 기본 외부 노출 — 되돌리기·보안 주의는 ocr-cpu의 ports 주석 참조
      - "${BIND_HOST:-0.0.0.0}:8003:8000"
    environment:
      OCR_DEVICE: cpu
      OCR_ENGINE: paddleocr_vl
      OCR_SIDECAR_URL: http://paddleocr-vl:8080
      OCR_SIDECAR_CONNECT_TIMEOUT_S: ${OCR_SIDECAR_CONNECT_TIMEOUT_S:-10}
      OCR_SIDECAR_READ_TIMEOUT_S: ${OCR_SIDECAR_READ_TIMEOUT_S:-600}
      OCR_SIDECAR_HEALTH_TIMEOUT_S: ${OCR_SIDECAR_HEALTH_TIMEOUT_S:-5}
      OCR_SIDECAR_MAX_RESPONSE_MB: ${OCR_SIDECAR_MAX_RESPONSE_MB:-20}
      OCR_SIDECAR_RETRIES: ${OCR_SIDECAR_RETRIES:-1}
      # 튜닝 가능해야 하는 노브 — 설명은 ocr-ovis의 동일 항목 참조
      OCR_SIDECAR_MODEL_WAIT_S: ${OCR_SIDECAR_MODEL_WAIT_S:-900}
      OCR_REMOTE_PAGE_CONCURRENCY: ${OCR_REMOTE_PAGE_CONCURRENCY:-1}
      PRELOAD_MODEL: ${PRELOAD_MODEL:-1}
      RENDER_DPI: ${RENDER_DPI:-200}
      MAX_PAGES: ${MAX_PAGES:-200}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
      PAGE_SEPARATOR: ${PAGE_SEPARATOR:-}   # 엔진 무관 — 설명은 ocr-ovis의 동일 항목 참조
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}   # 기본 * = 모든 Host 허용 (ocr-cpu 주석 참조)
      JOB_TTL_DAYS: ${JOB_TTL_DAYS:-0}
      # ── 한국어 번역 (OpenAI 호환 API) — 미설정 시 번역 기능만 비활성 ──
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      TRANSLATE_MODEL: ${TRANSLATE_MODEL:-}
      TRANSLATE_API_MODE: ${TRANSLATE_API_MODE:-auto}
      TRANSLATE_CONCURRENCY: ${TRANSLATE_CONCURRENCY:-8}
      TRANSLATE_GLOBAL_CONCURRENCY: ${TRANSLATE_GLOBAL_CONCURRENCY:-}
      TRANSLATE_TIMEOUT_S: ${TRANSLATE_TIMEOUT_S:-180}
      TRANSLATE_MAX_RETRIES: ${TRANSLATE_MAX_RETRIES:-3}
      TRANSLATE_TEMPERATURE: ${TRANSLATE_TEMPERATURE:-0}
      TRANSLATE_MAX_TOKENS_PARAM: ${TRANSLATE_MAX_TOKENS_PARAM:-max_tokens}
      TRANSLATE_REASONING: ${TRANSLATE_REASONING:-}
      TRANSLATE_CONTEXT: ${TRANSLATE_CONTEXT:-1}
      PDF_EXPORT_FONT: ${PDF_EXPORT_FONT:-}   # 내보내기 폰트 스레딩 — 설명은 ocr-cpu 참조
      # ── textlayer 엔진 · 페이지 Q&A (Localight 통합) — 설명은 ocr-cpu 참조 ──
      OCR_LANGUAGES: ${OCR_LANGUAGES:-eng+kor}
      NATIVE_TEXT_THRESHOLD: ${NATIVE_TEXT_THRESHOLD:-120}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai-responses}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-low}
      LLM_OPENAI_BASE_URL: ${LLM_OPENAI_BASE_URL:-https://api.openai.com/v1}
      # Q&A 전용 키 — 번역용 OPENAI_API_KEY와 분리돼 있다(app/llm/validate.py).
      # 없으면 컨테이너 배포에서 openai-* 공급자가 항상 available:false가 된다
      # (컨테이너 안에는 .env가 없어 dotenv 폴백도 없다).
      LLM_OPENAI_API_KEY: ${LLM_OPENAI_API_KEY:-}
      LLM_OPENAI_RESPONSES_MODELS: ${LLM_OPENAI_RESPONSES_MODELS:-gpt-5.6-luna,gpt-5.6-terra,gpt-5.6-sol}
      LLM_OPENAI_CHAT_MODELS: ${LLM_OPENAI_CHAT_MODELS:-chat-latest,gpt-5.6-luna,gpt-5.6-terra}
      LLM_OPENAI_RESPONSES_MODEL: ${LLM_OPENAI_RESPONSES_MODEL:-gpt-5.6-luna}
      LLM_OPENAI_CHAT_MODEL: ${LLM_OPENAI_CHAT_MODEL:-chat-latest}
    volumes:
      - ocr-data:/data      # 잡 데이터 공유 — 설명은 ocr-ovis 참조
      - hf-cache:/data/hf
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    depends_on:
      paddleocr-vl:
        condition: service_started
    logging: *default-logging
    # 메모리 상한 — 설명은 ocr-cpu 참조 (.env로 조정 가능)
    deploy:
      resources:
        limits:
          memory: ${OCR_WEB_MEM_LIMIT:-8g}
    restart: unless-stopped

  paddleocr-vl:
    build:
      context: services/paddleocr_vl
    image: paddleocr-vl-sidecar:3.6.0-cu129
    profiles: ["paddle"]
    gpus: all
    expose:
      - "8080"
    environment:
      CUDA_DEVICE_ORDER: PCI_BUS_ID    # GPU_DEVICE 인덱스를 nvidia-smi(PCI) 순서에 고정
      CUDA_VISIBLE_DEVICES: ${GPU_DEVICE:-0}
      HF_TOKEN: ${HF_TOKEN:-}
      PADDLE_PDX_MODEL_SOURCE: huggingface
      PADDLEOCR_MODEL_ID: ${PADDLEOCR_MODEL_ID:-PaddlePaddle/PaddleOCR-VL-1.6}
      PADDLEOCR_MODEL_REVISION: ${PADDLEOCR_MODEL_REVISION:-}  # 빈 값 = 코드 기본 고정 SHA
      PADDLEOCR_DEVICE: ${PADDLEOCR_DEVICE:-gpu:0}
      PADDLEOCR_MIN_PIXELS: ${PADDLEOCR_MIN_PIXELS:-}
      PADDLEOCR_MAX_PIXELS: ${PADDLEOCR_MAX_PIXELS:-}
      PADDLEOCR_MAX_UPLOAD_MB: ${PADDLEOCR_MAX_UPLOAD_MB:-128}  # backend 페이지 PNG 상한과 정합
    volumes:
      - paddle-hf-cache:/data/hf     # HF 모델 캐시 (Paddle 캐시와 분리)
      - paddle-x-cache:/home/app/.paddlex  # PaddleX 캐시 ($HOME 기준 — 비루트 실행)
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    # 메모리 상한 — 설명은 ocr-cpu 참조 (.env로 조정 가능)
    deploy:
      resources:
        limits:
          memory: ${PADDLE_MEM_LIMIT:-24g}
    restart: unless-stopped

volumes:
  # 잡 데이터·HF 캐시는 네 백엔드 서비스가 공유한다(엔진 전환 시 잡 이력 보존).
  #
  # ⚠ compose 볼륨의 **실제 이름에는 프로젝트 접두사가 붙는다**: `<PROJECT>_ocr-data`
  #   (PROJECT 기본값 = compose 파일이 있는 디렉터리 이름, `-p`/`COMPOSE_PROJECT_NAME`으로 변경).
  #   아래 명령들을 접두사 없이 그대로 복사하면 **없는 볼륨을 새로 만들고 exit 0**이 나서
  #   아무것도 안 옮겨졌는데 성공으로 보인다. 반드시 이름 확인 → 존재 가드 순으로 진행할 것.
  #
  # ⚠ 과거 버전의 ocr-ovis-data / ocr-paddle-data 볼륨은 더 이상 참조되지 않는다 —
  #   그 안의 잡을 살리려면 한 번만 옮기고 지운다 (compose 파일이 있는 디렉터리에서 실행):
  #
  #   1) 실제 이름 확인 (접두사 포함). 프로필 볼륨(ovis-/paddle-)은 해당 프로필을
  #      켜야 목록에 나온다:
  #        docker compose --profile ovis --profile paddle config --format json \
  #          | python3 -c 'import json,sys; [print(k,"->",v.get("name",k)) for k,v in json.load(sys.stdin).get("volumes",{}).items()]'
  #        # 예: ocr-data -> pdf-ocr-translator_ocr-data  → 접두사는 pdf-ocr-translator
  #        docker volume ls | grep -E 'ocr-(ovis-|paddle-)?data'   # 남아 있는 옛 볼륨
  #   2) 확인한 이름을 넣는다 (<PROJECT>는 자리표시자 — 그대로 쓰지 말 것):
  #        SRC=<PROJECT>_ocr-ovis-data      # paddle은 <PROJECT>_ocr-paddle-data로 반복
  #        DST=<PROJECT>_ocr-data
  #   3) 존재 가드 — **이 단계가 유일한 안전장치다**. `-v`도 `--mount type=volume`도
  #      미존재 이름이면 빈 볼륨을 새로 만들고 exit 0을 낸다(실측 확인). 오타·접두사
  #      누락을 조용한 no-op 대신 즉시 실패로 바꾸려면 반드시 먼저 돌린다:
  #        docker volume inspect "$SRC" >/dev/null || { echo "없는 볼륨: $SRC"; exit 1; }
  #        docker volume inspect "$DST" >/dev/null || { echo "없는 볼륨: $DST"; exit 1; }
  #   4) 복사 — `--mount`를 쓴다(원본에 readonly를 걸 수 있어 `-v`보다 안전).
  #      ⚠ 이미지는 **GNU coreutils가 있는 것**(debian:stable-slim)을 쓴다. alpine의
  #        busybox `cp -n`은 대상 디렉터리가 이미 있으면 트리 전체를 조용히 건너뛰고
  #        exit 0을 낸다(실측: 0바이트 복사). 먼저 백엔드를 멈춰 쓰기 중인 잡이 없게 한다:
  #        docker compose stop ocr-cpu ocr-cuda ocr-ovis ocr-paddle
  #        docker run --rm \
  #          --mount type=volume,src="$SRC",dst=/from,readonly \
  #          --mount type=volume,src="$DST",dst=/to \
  #          debian:stable-slim cp -an /from/. /to/     # -n: 기존 잡을 덮어쓰지 않는다
  #   5) 옮겨졌는지 눈으로 확인한 **뒤에만** 삭제 (jobs/ 밑 잡 개수를 원본과 비교):
  #        for V in "$SRC" "$DST"; do \
  #          echo -n "$V: "; \
  #          docker run --rm --mount type=volume,src="$V",dst=/v debian:stable-slim \
  #            sh -c 'ls /v/jobs 2>/dev/null | wc -l'; \
  #        done
  #        docker volume rm "$SRC"
  ocr-data:
  hf-cache:
  # sidecar 모델 캐시는 런타임(vLLM/PaddleX)이 서로 달라 분리 유지한다.
  ovis-hf-cache:
  paddle-hf-cache:
  paddle-x-cache:
