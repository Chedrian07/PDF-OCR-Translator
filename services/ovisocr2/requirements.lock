# OvisOCR2 sidecar 덧씌움(overlay) 잠금 — 웹 계층만 정확히 고정하고 해시로 검증한다.
# 베이스 이미지(vLLM)의 나머지 패키지는 Dockerfile의 digest 고정이 재현성을 맡는다.
# Dockerfile이 `pip install --require-hashes --no-deps --only-binary :all:`로 설치한다:
# 목록 밖 패키지는 건드리지 않고, 해시 불일치·소스 빌드는 빌드 실패다.
# CI(dependency-audit 잡)가 이 파일을 pip-audit로 검사한다.
#
# 다시 만들기 (services/ovisocr2에서, uv 0.12 — 이유·목록은 requirements.in):
#   uv pip compile requirements.in --no-deps --generate-hashes --no-header \
#     --python-version 3.12 --python-platform x86_64-manylinux_2_35 \
#     -o requirements.lock          # 그 뒤 이 머리말을 다시 붙인다
# 전부 순수 파이썬 휠이라 linux/amd64·arm64 베이스 모두에 그대로 맞는다.
