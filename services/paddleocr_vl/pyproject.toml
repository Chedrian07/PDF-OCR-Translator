[project]
name = "paddleocr-vl-sidecar"
version = "0.1.0"
description = "PaddleOCR-VL-1.6 CUDA sidecar (내부 프로토콜 v1)"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"

# 규칙은 backend/pyproject.toml과 같게 명시한다(ruff 기본값 변경에 끌려가지 않게).
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
